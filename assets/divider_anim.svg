<svg xmlns="http://www.w3.org/2000/svg" width="800" height="16" viewBox="0 0 800 16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="t" width="16" height="16" patternUnits="userSpaceOnUse">
<rect width="16" height="16" fill="#5b3a1e"/><rect width="16" height="6" fill="#5d9c37"/>
<rect x="2" y="9" width="3" height="3" fill="#4a2f17"/><rect x="10" y="11" width="3" height="3" fill="#6b4524"/>
<rect x="3" y="1" width="3" height="2" fill="#7bc24a"/>
</pattern>
<linearGradient id="g"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="16" fill="url(#t)"/>
<rect y="0" width="120" height="16" fill="url(#g)"><animate attributeName="x" from="-120" to="800" dur="3s" repeatCount="indefinite"/></rect>
</svg>
